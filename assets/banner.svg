<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="50%" stop-color="#140204" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>

    <!-- Crimson Glow Gradient -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e27" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff1e27" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff4444" stop-opacity="1" />
      <stop offset="70%" stop-color="#ff1e27" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff1e27" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Ambient Red Light -->
    <radialGradient id="ambientRed" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#8b0000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Top Accent Line -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e27" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff1e27" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff1e27" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
      font-weight: 900;
      font-size: 58px;
      letter-spacing: 6px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 4px;
      fill: #ff3b44;
    }
    .tagline {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 2px;
      fill: #a0a0a8;
    }
    .grid-line {
      stroke: #ffffff;
      stroke-opacity: 0.03;
      stroke-width: 1;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines -->
  <line x1="100" y1="0" x2="100" y2="320" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
  <line x1="500" y1="0" x2="500" y2="320" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="320" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="320" class="grid-line" />
  <line x1="1100" y1="0" x2="1100" y2="320" class="grid-line" />
  <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
  <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
  <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />

  <!-- Ambient Center Red Glow -->
  <rect width="1200" height="320" rx="16" fill="url(#ambientRed)" />

  <!-- Border & Neon Accents -->
  <rect x="1.5" y="1.5" width="1197" height="317" rx="15" fill="none" stroke="#ff1e27" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Glowing Horizontal Beams -->
  <line x1="200" y1="2" x2="1000" y2="2" stroke="url(#lineGrad)" stroke-width="3" filter="url(#glow)" />
  <line x1="350" y1="318" x2="850" y2="318" stroke="url(#lineGrad)" stroke-width="2" filter="url(#glow)" />

  <!-- Decorative Corner Accents -->
  <path d="M 16 45 L 16 16 L 45 16" fill="none" stroke="#ff1e27" stroke-width="2.5" />
  <path d="M 1184 45 L 1184 16 L 1155 16" fill="none" stroke="#ff1e27" stroke-width="2.5" />
  <path d="M 16 275 L 16 304 L 45 304" fill="none" stroke="#ff1e27" stroke-width="2.5" />
  <path d="M 1184 275 L 1184 304 L 1155 304" fill="none" stroke="#ff1e27" stroke-width="2.5" />

  <!-- Main Title -->
  <g filter="url(#glow)">
    <text x="600" y="130" text-anchor="middle" class="title">ASHISH RAUTELA</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="180" text-anchor="middle" class="subtitle">FULL-STACK &amp; CLOUD ENGINEER</text>

  <!-- Divider Line -->
  <line x1="450" y1="210" x2="750" y2="210" stroke="url(#lineGrad)" stroke-width="2" />

  <!-- Tagline / Focus -->
  <text x="600" y="248" text-anchor="middle" class="tagline">MERN STACK  •  AWS CLOUD  •  DATA STRUCTURES &amp; ALGORITHMS (C++)</text>
</svg>
